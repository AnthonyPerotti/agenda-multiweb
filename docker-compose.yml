# ============================================================
# docker-compose.yml — Agenda Multiweb (CTE/UFSM)
# Otimizado para deploy no Portainer via GitHub Registry
# ============================================================

services:
  agenda-multiweb:
    image: ghcr.io/anthonyperotti/agenda-multiweb:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: agenda-multiweb
    restart: unless-stopped
    ports:
      # Mapeia a porta do servidor (padrão 80) para a porta 3000 interna do container
      - "${FRONTEND_PORT:-80}:3000"
    environment:
      # Banco de Dados SQLite
      - DATABASE_URL=file:./data/agenda.db
      # NextAuth (Chave de criptografia de sessão)
      - AUTH_SECRET=${AUTH_SECRET:-dev-secret-agenda-multiweb-cte-ufsm-2024}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost}
      # URL pública para links nos e-mails
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost}
      - NODE_ENV=production
    volumes:
      # Volume persistente para o banco SQLite
      - agenda-data:/app/data
      # Volume persistente para uploads/anexos
      - agenda-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  agenda-data:
    driver: local
  agenda-uploads:
    driver: local
